<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>음성인식 강의 받아쓰기 메모장 v9</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Malgun Gothic', Arial, sans-serif;
      background-color: #0b1020;
      color: #f1f5f9;
      padding: 16px;
    }
    .page-box { max-width: 1120px; margin: 0 auto; }
    h1 { font-size: 1.3rem; color: #38bdf8; margin-bottom: 4px; }
    .sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 14px; }
    .panel {
      background-color: #151e32;
      border: 1px solid #263554;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .btn-area { margin-bottom: 12px; }
    button.m-btn {
      display: inline-block;
      padding: 10px 14px;
      margin-right: 6px;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }
    button.m-btn:active { opacity: 0.8; }
    #startBtn { background-color: #22c55e; color: #052e16; }
    #stopBtn  { background-color: #f59e0b; color: #451a03; }
    #clearBtn { background-color: #64748b; color: #ffffff; }
    #saveBtn  { background-color: #0284c7; color: #ffffff; }
    #checkMicBtn { background-color: #a855f7; color: #ffffff; }

    .live-box {
      background-color: #090e1a;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .live-title { font-size: 0.78rem; color: #38bdf8; font-weight: bold; margin-bottom: 4px; }
    #liveCaption { font-size: 0.96rem; color: #e0f2fe; line-height: 1.45; min-height: 1.4em; }

    .label { font-size: 0.84rem; color: #cbd5e1; font-weight: bold; margin: 10px 0 5px; }
    textarea.raw-area {
      width: 100%;
      height: 260px;
      background-color: #060913;
      color: #f8fafc;
      border: 1px solid #263554;
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.55;
      font-size: 15px;
    }
    .ctrl-box {
      background-color: #0d1424;
      border: 1px solid #22304d;
      border-radius: 7px;
      padding: 9px 11px;
      margin-bottom: 10px;
    }
    .ctrl-row { font-size: 0.85rem; margin-bottom: 5px; }
    .ctrl-val { color: #38bdf8; font-weight: bold; margin-left: 8px; }
    input[type="range"], select { width: 100%; cursor: pointer; }
    select {
      background-color: #060913;
      color: #f8fafc;
      border: 1px solid #263554;
      border-radius: 6px;
      padding: 6px 8px;
    }
    canvas {
      width: 100%;
      background-color: #060913;
      border: 1px solid #22304d;
      border-radius: 8px;
      display: block;
      margin-top: 6px;
    }
    .info-line {
      margin-top: 10px;
      font-size: 0.86rem;
      color: #f8fafc;
      background-color: #0d1424;
      border: 1px solid #22304d;
      border-radius: 7px;
      padding: 8px 10px;
    }
    .status-line {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #cbd5e1;
      background-color: #0d1424;
      border-radius: 7px;
      padding: 8px 10px;
    }
  </style>
</head>
<body>
  <div class="page-box">
    <h1>음성인식으로 강의내용을 받아적는 메모장 (v9)</h1>
    <p class="sub">브라우저 음성 인식 · 실시간 자막 · 마이크 장치 확인 · 메모 글자 크기 조절</p>

    <div class="panel">
      <div class="btn-area">
        <button type="button" class="m-btn" id="startBtn">▶ 받아쓰기 시작</button>
        <button type="button" class="m-btn" id="stopBtn">⏸ 정지</button>
        <button type="button" class="m-btn" id="clearBtn">↺ 초기화</button>
        <button type="button" class="m-btn" id="saveBtn">💾 노트 저장</button>
        <button type="button" class="m-btn" id="checkMicBtn">🎤 마이크 장치 확인</button>
      </div>

      <div class="live-box">
        <div class="live-title">실시간 인식 자막 (말하는 중인 문장이 여기에 표시됩니다)</div>
        <div id="liveCaption">대기 중입니다. [▶ 받아쓰기 시작]을 누르고 마이크 사용을 허용하세요.</div>
      </div>

      <div class="label">실시간 강의 받아쓰기 원문 (직접 입력·수정 가능)</div>
      <textarea id="rawMemo" class="raw-area" style="font-size:15px;" placeholder="마이크로 들은 말이 여기에 받아적힙니다. 직접 입력하거나 수정할 수도 있습니다."></textarea>

      <div class="info-line" id="statLine">받아쓴 글자 수: 0 자 | 문장 수: 0 문장 | 강의 경과: 0.0 s</div>
      <div class="status-line" id="statusLine">상태: 준비 완료</div>
    </div>

    <div class="panel">
      <div class="ctrl-box">
        <div class="ctrl-row"><span>인식 언어</span><span class="ctrl-val" id="langLabel">한국어</span></div>
        <select id="langSelect">
          <option value="ko-KR">한국어 (ko-KR)</option>
          <option value="en-US">English (en-US)</option>
          <option value="ja-JP">日本語 (ja-JP)</option>
          <option value="zh-CN">中文 (zh-CN)</option>
        </select>
      </div>

      <div class="ctrl-box">
        <div class="ctrl-row"><span>메모 글자 크기</span><span class="ctrl-val" id="fontLabel">15 px</span></div>
        <input type="range" id="fontRange" min="12" max="24" step="1" value="15" />
      </div>

      <div class="ctrl-box">
        <div class="ctrl-row"><span>인식 상태 표시 바 감도</span><span class="ctrl-val" id="gainLabel">1.0x</span></div>
        <input type="range" id="gainRange" min="0.5" max="4.0" step="0.1" value="1.0" />
      </div>

      <div class="label">음성 인식 활성 상태 파형</div>
      <canvas id="waveCanvas" width="380" height="120"></canvas>
    </div>
  </div>

  <script>
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    var running = false;
    var rec = null;
    var restartTimer = null;
    var elapsedMs = 0;
    var startedAt = 0;
    var gain = 1.0;
    var lang = 'ko-KR';
    var pulseLevel = 0;

    var BAR_COUNT = 36;
    var bars = [];
    for (var b = 0; b < BAR_COUNT; b++) bars.push(4);

    function $(id) { return document.getElementById(id); }
    function setCaption(t) { var el = $('liveCaption'); if (el) el.textContent = t; }
    function setStatus(t) { var el = $('statusLine'); if (el) el.textContent = '상태: ' + t; }

    function currentElapsed() {
      return (elapsedMs + (running && startedAt ? Date.now() - startedAt : 0)) / 1000;
    }

    function refreshStats() {
      var raw = $('rawMemo');
      var stat = $('statLine');
      if (!raw || !stat) return;
      var txt = raw.value || '';
      var arr = txt.split(/\r?\n/);
      var cnt = 0;
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].replace(/\s+/g, '') !== '') cnt++;
      }
      stat.textContent = '받아쓴 글자 수: ' + txt.length + ' 자 | 문장 수: ' + cnt +
        ' 문장 | 강의 경과: ' + currentElapsed().toFixed(1) + ' s';
    }

    function appendLine(s) {
      var raw = $('rawMemo');
      s = (s || '').replace(/^\s+|\s+$/g, '');
      if (!raw || !s) return;
      if (raw.value && raw.value.charAt(raw.value.length - 1) !== '\n') raw.value += '\n';
      raw.value += s + '\n';
      raw.scrollTop = raw.scrollHeight;
      refreshStats();
    }

    function clearRestartTimer() {
      if (restartTimer) {
        clearTimeout(restartTimer);
        restartTimer = null;
      }
    }

    function endRun() {
      if (running) elapsedMs += Date.now() - startedAt;
      running = false;
      startedAt = 0;
      pulseLevel = 0;
      refreshStats();
    }

    function checkMicDevices() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
        setStatus('이 환경에서는 장치 목록 조회를 지원하지 않습니다.');
        return;
      }
      navigator.mediaDevices.enumerateDevices().then(function (devices) {
        var mics = [];
        for (var i = 0; i < devices.length; i++) {
          if (devices[i].kind === 'audioinput') {
            mics.push(devices[i].label || ('마이크 #' + (mics.length + 1)));
          }
        }
        if (mics.length === 0) {
          setCaption('감지된 오디오 입력(마이크) 장치가 0개입니다. 기기 설정에서 마이크 연결/활성화를 확인하세요.');
          setStatus('감지된 마이크: 0개');
        } else {
          setCaption('감지된 마이크(' + mics.length + '개): ' + mics.join(', '));
          setStatus('감지된 마이크: ' + mics.length + '개');
        }
      }).catch(function (err) {
        setStatus('마이크 조회 오류: ' + err.message);
      });
    }

    function createRecognizer() {
      var r = new SR();
      r.lang = lang;
      r.continuous = true;
      r.interimResults = true;
      r.maxAlternatives = 1;

      r.onstart = function () {
        setStatus('듣는 중… 말씀하세요 (' + lang + ')');
        setCaption('듣는 중입니다. 말씀하세요…');
      };

      r.onspeechstart = function () {
        pulseLevel = 0.7;
      };

      r.onspeechend = function () {
        pulseLevel = 0.1;
      };

      r.onresult = function (e) {
        pulseLevel = 0.85;
        var interim = '';
        for (var i = e.resultIndex; i < e.results.length; i++) {
          var text = e.results[i][0].transcript;
          if (e.results[i].isFinal) appendLine(text);
          else interim += text;
        }
        setCaption(interim ? interim : '듣는 중입니다. 말씀하세요…');
      };

      r.onerror = function (e) {
        var err = e.error;
        if (err === 'no-speech' || err === 'aborted') return;

        if (err === 'not-allowed' || err === 'service-not-allowed') {
          haltAll();
          setCaption('마이크 권한이 차단되었습니다. 브라우저 주소창 왼쪽 아이콘과 기기 설정에서 마이크를 허용해 주세요.');
          setStatus('마이크 차단됨');
        } else if (err === 'audio-capture') {
          haltAll();
          setCaption('마이크 장치를 잡지 못했습니다(audio-capture). 다른 앱이 마이크를 사용 중인지 닫고, [🎤 마이크 장치 확인]을 눌러보세요.');
          setStatus('마이크 장치 오류 (audio-capture)');
        } else if (err === 'network') {
          setStatus('음성 인식 서버 일시 오류 — 재연결 시도 중');
        } else {
          setStatus('인식 오류: ' + err);
        }
      };

      r.onend = function () {
        clearRestartTimer();
        if (running && rec === r) {
          restartTimer = setTimeout(function () {
            if (running && rec === r) {
              try {
                r.start();
              } catch (e) {
                try {
                  rec = createRecognizer();
                  rec.start();
                } catch (err2) {
                  setStatus('재시작 대기 중…');
                }
              }
            }
          }, 250);
        }
      };

      return r;
    }

    function startLecture() {
      if (running) return;

      if (!SR) {
        setCaption('이 브라우저는 Web Speech 음성 인식을 지원하지 않습니다. Chrome, Edge 또는 iOS Safari에서 열어주세요.');
        setStatus('음성 인식 미지원 (직접 입력 가능)');
        return;
      }

      clearRestartTimer();
      running = true;
      startedAt = Date.now();
      setCaption('음성 인식을 시작하는 중입니다. 마이크 권한 창이 뜨면 [허용]을 눌러주세요.');
      setStatus('시작 중 (' + lang + ')');

      try {
        rec = createRecognizer();
        rec.start();
      } catch (err) {
        endRun();
        rec = null;
        setCaption('음성 인식을 시작하지 못했습니다: ' + err.message);
        setStatus('시작 실패');
      }
    }

    function haltAll() {
      clearRestartTimer();
      endRun();
      var r = rec;
      rec = null;
      if (r) {
        r.onend = null;
        r.onerror = null;
        try { r.stop(); } catch (e) {}
      }
    }

    function stopLecture() {
      if (!running) return;
      haltAll();
      setCaption('일시 정지되었습니다. [▶ 받아쓰기 시작]을 누르면 이어서 받아씁니다.');
      setStatus('일시 정지');
    }

    function clearLecture() {
      haltAll();
      elapsedMs = 0;
      var raw = $('rawMemo');
      if (raw) raw.value = '';
      setCaption('대기 중입니다. [▶ 받아쓰기 시작]을 누르고 마이크 사용을 허용하세요.');
      setStatus('초기화 완료');
      refreshStats();
    }

    function saveLecture() {
      var raw = $('rawMemo');
      var txt = '=== 강의 받아쓰기 원문 ===\n' + (raw ? raw.value : '');
      try {
        var blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '강의받아쓰기_메모_v9.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        setStatus('노트(.txt) 저장 완료');
      } catch (e) {
        setStatus('저장이 제한된 환경입니다. 원문을 복사해 사용해 주세요.');
      }
    }

    function setFont(v) {
      var px = parseInt(v, 10) || 15;
      $('fontLabel').textContent = px + ' px';
      $('rawMemo').style.fontSize = px + 'px';
    }

    function setGain(v) {
      gain = parseFloat(v) || 1.0;
      $('gainLabel').textContent = gain.toFixed(1) + 'x';
    }

    function setLang(v) {
      lang = v;
      var sel = $('langSelect');
      $('langLabel').textContent = sel.options[sel.selectedIndex].text.split(' ')[0];
      if (running) {
        clearRestartTimer();
        var oldRec = rec;
        rec = null;
        if (oldRec) {
          oldRec.onend = null;
          try { oldRec.abort(); } catch (e) {}
        }
        try {
          rec = createRecognizer();
          rec.start();
        } catch (e) {
          setStatus('언어 전환 중 오류');
        }
      }
    }

    function bind(id, ev, fn) {
      var el = $(id);
      if (el) el.addEventListener(ev, fn);
    }

    bind('startBtn', 'click', startLecture);
    bind('stopBtn', 'click', stopLecture);
    bind('clearBtn', 'click', clearLecture);
    bind('saveBtn', 'click', saveLecture);
    bind('checkMicBtn', 'click', checkMicDevices);
    bind('rawMemo', 'input', refreshStats);
    bind('langSelect', 'change', function () { setLang(this.value); });
    bind('fontRange', 'input', function () { setFont(this.value); });
    bind('gainRange', 'input', function () { setGain(this.value); });

    if (SR) {
      setStatus('준비 완료 (브라우저 음성 인식 사용)');
    } else {
      setCaption('이 브라우저는 Web Speech 음성 인식을 지원하지 않습니다.');
      setStatus('음성 인식 미지원');
    }

    setInterval(function () {
      if (running) refreshStats();

      var level = running ? (pulseLevel + Math.random() * 0.08) : 0;
      pulseLevel *= 0.85;
      var bh = 4 + level * 70 * gain;
      if (bh > 80) bh = 80;
      if (bh < 4) bh = 4;
      bars.shift();
      bars.push(bh);

      var cv = $('waveCanvas');
      if (cv && cv.getContext) {
        var ctx = cv.getContext('2d');
        ctx.clearRect(0, 0, cv.width, cv.height);
        var bw = cv.width / bars.length;
        for (var i = 0; i < bars.length; i++) {
          ctx.fillStyle = running ? '#38bdf8' : '#475569';
          ctx.fillRect(i * bw + 2, (cv.height - bars[i]) / 2, Math.max(2, bw - 4), bars[i]);
        }
      }
    }, 60);
  </script>
</body>
</html>
